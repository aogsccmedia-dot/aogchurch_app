# Runs on every pull request and every push: type-check, tests, and a full
# Wrangler build (dry run) so broken code never reaches production.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is verified inside deploy.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Unit & API tests
        run: npm test

      - name: Build Worker bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist
