# Production deploy to Cloudflare (aogsccyouth.com).
# Every push to main: verify → apply D1 migrations → deploy the Worker + static site.
#
# Requires repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template, scoped to the account + aogsccyouth.com zone,
#                            plus "D1: Edit" permission for migrations
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Never run two production deploys at once; queue them in order.
concurrency:
  group: production
  cancel-in-progress: false

# Credentials may be saved as repository *secrets* (recommended) or *variables*; common names are accepted.
env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://aogsccyouth.com
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        shell: bash
        run: |
          # Clean common paste mistakes: whitespace/newlines, quotes, a "Bearer " prefix.
          RAW="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]"' | sed -E 's/^[Bb]earer//')"
          # "NAME=value" or "label: value" pasted by mistake → keep the value part.
          RAW="${RAW##*=}"; RAW="${RAW##*:}"
          # Keep only characters that can appear in a Cloudflare API token.
          TOKEN="$(printf '%s' "$RAW" | LC_ALL=C tr -cd 'A-Za-z0-9_-')"
          REMOVED=$(( ${#RAW} - ${#TOKEN} ))
          PREFIX=""; [[ "$TOKEN" =~ ^([a-z]{2,6}_) ]] && PREFIX="${BASH_REMATCH[1]}"
          ACCOUNT="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]"')"
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
          RAWLEN=${#CF_TOKEN}; LEN=${#TOKEN}
          SHAPE="other"
          [[ "$TOKEN" =~ ^[A-Za-z0-9_-]{40}$ ]] && SHAPE="looks like an API token"
          [[ "$TOKEN" =~ ^[a-f0-9]{32}$ ]] && SHAPE="looks like an Account ID (32 hex) — not a token"
          [[ "$TOKEN" =~ ^[a-f0-9]{37}$ ]] && SHAPE="looks like a Global API Key — create an API token instead"
          [[ "$TOKEN" =~ ^cfut_ ]] && SHAPE="looks like an API token (cfut_)"
          echo "::notice title=Cloudflare token check::stored length ${RAWLEN}, cleaned length ${LEN}, invalid characters removed: ${REMOVED}, prefix: ${PREFIX:-none}, shape: ${SHAPE}; account id present: $([ -n "$ACCOUNT" ] && echo yes || echo no)"
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          if [ -z "$TOKEN" ]; then
            echo "::warning::Cloudflare API token not found — skipping deploy. See docs/DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Apply database migrations (D1)
        if: steps.creds.outputs.ready == 'true'
        id: migrate
        continue-on-error: true   # schema changes are idempotent; never block a site deploy on them
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          set -o pipefail
          if ! npx wrangler d1 migrations apply aogscc-youth-db --remote 2>&1 | tee migrate.log; then
            echo "::warning title=D1 migrations failed::$(grep -v '^\s*$' migrate.log | tail -15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi

      - name: Deploy Worker
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy --message "commit ${{ github.sha }}" 2>&1 | tee deploy.log; then
            echo "::error title=wrangler deploy failed::$(grep -v '^\s*$' deploy.log | tail -20 | tr '\n' ' ' | cut -c1-2000)"
            exit 1
          fi
          echo "::notice title=Deployed::$(sed -n '/Deployed/,$p' deploy.log | grep -v '^\s*$' | tr '\n' ' ' | cut -c1-1200)"

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://aogsccyouth.com/api/health; then echo; exit 0; fi
            echo "waiting for the new version…"; sleep 10
          done
          w=$(curl -sS -o /dev/null -w '%{http_code}' https://aogchurch-app.aogsccmedia.workers.dev/api/health 2>&1 || true)
          d=$(curl -sS -o /dev/null -w '%{http_code} %{remote_ip}' https://aogsccyouth.com/api/health 2>&1 || true)
          echo "::warning::Health check didn't pass yet. workers.dev → $w · aogsccyouth.com → $d"
