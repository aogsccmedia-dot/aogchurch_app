<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<title>FreeCreator · Phone camera</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/freecreator/app/studio.css">
<style>
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
  .pc-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .pc-view { position: relative; background: #000; display: grid; place-items: center; overflow: hidden; }
  .pc-view video { width: 100%; height: 100%; object-fit: contain; }
  .pc-view .st-tag { top: 12px; left: 12px; }
  .pc-ctl { display: grid; gap: 10px; padding: 14px 16px 18px; background: var(--panel); border-top: 1px solid var(--line); }
  .pc-ctl .st-row { flex-wrap: wrap; }
  .pc-code { font: 700 28px/1 "Jost", system-ui; letter-spacing: .3em; text-align: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #0f0f15; width: 100%; color: #fff; }
  .pc-msg { min-height: 20px; color: var(--muted); font-size: 13px; text-align: center; }
  .pc-blocked { padding: 32px 20px; display: grid; gap: 12px; text-align: center; place-content: center; }
</style>
</head>
<body>
<header class="pc-top"><div class="st-brand"><b>FreeCreator</b><span>Phone camera</span></div><span class="st-pill" id="pcState">Not connected</span></header>
<main class="pc-view"><video id="pcVideo" playsinline muted autoplay></video><span class="st-tag" id="pcTag">PREVIEW</span></main>
<section class="pc-ctl" id="pcCtl">
  <input class="pc-code" id="pcCode" inputmode="numeric" maxlength="6" placeholder="Studio code" autocomplete="one-time-code">
  <div class="st-row"><button class="st-btn" id="pcFlip">Switch camera</button><select class="st-btn" id="pcQ"><option value="720">720p</option><option value="1080" selected>1080p</option></select><label class="st-check"><input type="checkbox" id="pcAudio"> Send phone sound</label></div>
  <button class="st-btn go" id="pcGo">Connect to Studio</button>
  <p class="pc-msg" id="pcMsg">In the Studio on the computer: Inputs → Phone cameras → “Add a phone”. Type the code here.</p>
</section>
<script type="module" src="/freecreator/app/camera.js"></script>
</body>
</html>
