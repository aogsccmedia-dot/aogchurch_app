
  <main id="main" class="wrap">
    <div id="me-signin" class="cta-band" hidden>
      <p class="eyebrow gold">My profile</p>
      <h2>Welcome <span class="serif">home.</span></h2>
      <p class="lede" style="text-align:center">Sign in with Google to see your events, manage the weekly letter and complete joining.</p>
      <div id="me-google" class="google-slot"></div>
    </div>
    <div class="me-grid" id="me-view" hidden>
      <aside class="me-card">
        <span class="avatar" id="me-avatar"></span>
        <div><h2 id="me-name" style="font-size:26px"></h2><p class="muted-text" id="me-email"></p></div>
        <div id="me-member"></div>
        <div class="toggle"><div><b style="font-weight:450">Weekly letter</b><p class="muted-text" style="font-size:13px">Sunday afternoons · services &amp; encouragement</p></div>
          <label class="switch"><input type="checkbox" id="me-letter" aria-label="Receive the weekly letter"></label></div>
        <button class="btn btn-sm" id="me-signout">Sign out</button>
      </aside>
      <section style="display:grid;gap:18px">
        <div class="section-head" style="margin:0"><p class="eyebrow gold">My events</p><h2>Where I'll be</h2></div>
        <div id="me-events" class="event-grid"></div>
      </section>
    </div>
  </main>
